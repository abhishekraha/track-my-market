services:
  track-my-market:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: track-my-market
    restart: unless-stopped
    # Allocate shared memory for Aeron IPC ring buffers
    shm_size: 512m
    environment:
      - MARKET_SYMBOLS=RELIANCE.NS,TCS.NS,INFY.NS,HDFCBANK.NS
      - MARKET_POLL_INTERVAL_MS=3000
      - MARKET_UI_ENABLED=true
      - MARKET_SERVER_PORT=8080
      - MARKET_SERVER_BIND_HOST=0.0.0.0
      - MARKET_SERVER_CONTEXT_PATH=/
      - YAHOO_FINANCE_BASE_URL=https://query1.finance.yahoo.com
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/symbols || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: track-my-market-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - track-my-market
