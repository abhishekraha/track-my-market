events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    upstream market_backend {
        server track-my-market:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # ----------------------------------------------------------------------
        # Reverse Proxy Root to track-my-market Web Dashboard & API
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://market_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /;

            # Server-Sent Events (SSE) Streaming Optimization
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 24h;
        }

        # ----------------------------------------------------------------------
        # Example Sub-Path Reverse Proxy (e.g. /market/)
        # Demonstrates path rewriting and flexibility for sub-path hosting
        # ----------------------------------------------------------------------
        location /market/ {
            proxy_pass http://market_backend/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /market;

            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 24h;
        }
    }
}
